<div class="container">
  <div class="form-section">
    <h2>Ingresar Datos</h2>

    <label for="nombre">Nombre completo:</label>
    <input type="text" id="nombre" [(ngModel)]="nombre" name="nombre"
           (input)="validarFormulario()" placeholder="Ingrese su nombre completo" required />

    <div class="service-section">
      <h2>Elegir Servicio</h2>

      <ul>
        <li *ngFor="let servicio of servicios">
          <label>
            <input type="radio" name="servicio" [value]="servicio.name" [(ngModel)]="servicioSeleccionado" (change)="validarFormulario()" />
            {{ servicio.name }}
          </label>
        </li>
      </ul>
    </div>

    <div *ngIf="errorMessage" class="alert alert-danger">
      {{ errorMessage }}
    </div>

    <button class="btn-generar" [disabled]="!formularioValido" (click)="generarCodigo()">
      Generar código
    </button>
  </div>
</div>
